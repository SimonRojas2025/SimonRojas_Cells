<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Tabla 2</title>
    <style>
        table, th{
            border: 1px solid white;
            border-collapse: collapse;
            text-align: center;
            padding: 40px 80px;
            background-color:#e5e8e8 ;
        }
        caption {
            caption-side: top;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Ejercicio Tabla 2</h1>
    <table>
        <tbody>
        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th rowspan="2">4, 8</th>
        </tr>
        <tr>
            <th>5</th>
            <th colspan="2">6, 7</th>
            <!-- <th>7</th> -->
            <!-- <th>8</th> -->
        </tr>
        <tr>
            <th rowspan="2">9, 13</th>
            <th>10</th>
            <th>11</th>
            <th>12</th>
        </tr>
        <tr>
            <!-- <th>13</th> -->
            <th>14</th>
            <th>15</th>
            <th>16</th>
        </tr>
    </tbody>
    <caption>CAPTION DE LA TABLA 2</caption>
    </table>
</body>
</html>
